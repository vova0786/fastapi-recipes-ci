name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: pytest
            command: python -m pytest
          - check: flake8
            command: python -m flake8 .
          - check: isort
            command: python -m isort --check-only --diff --skip .venv .
          - check: black
            command: python -m black --check --diff .
          - check: mypy
            command: python -m mypy main.py database.py models.py schemas.py tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установка зависимостей
        run: python -m pip install -r requirements-dev.txt
      - name: Проверка
        run: ${{ matrix.command }}
